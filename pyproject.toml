[project]
name = "fable-flow"
version = "0.2.0"
description = "AI-powered children's book and movie generation pipeline"
authors = [{ name = "Fable Flow Team" }]
readme = "README.md"
license = { text = "Elastic-2.0" }
requires-python = ">=3.13,<3.14"

dependencies = [
    # Core
    "openai>=1.40.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "omegaconf>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",

    # ML core (CUDA bundled in the wheel for torch>=2.5).
    # transformers pinned to 4.x: diffusers 0.37 HunyuanVideo hardcodes Llama-3
    # token id 271 for "\n\n", which changed in transformers 5.x. Lift the cap
    # when diffusers updates HunyuanVideo's prompt-embedding logic to look up
    # the separator token dynamically.
    "torch",
    "transformers>=4.56.0,<5.0.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "diffusers>=0.33.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.21.6",
    "numpy>=1.24.0",
    "xformers",
    # diffusers' Wan / FLUX / HunyuanVideo tokenizers reach for ftfy without
    # raising ImportError cleanly — without it you get NameError deep inside
    # the pipeline. Keep it explicit.
    "ftfy>=6.0",

    # Image processing
    "pillow>=10.0.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.5.0",

    # Audio (TTS + music)
    "kokoro>=0.9.2",
    "torchaudio",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1;python_version>='3.13'",
    "mutagen>=1.47.0",

    # Local LLM serving.
    # vllm 0.20+ ships CUDA 13 wheels (libcudart.so.13) which require driver 580+.
    # 0.19.1 is the last version built against CUDA 12 (libcudart.so.12); bump
    # this cap together with the driver if you upgrade.
    "vllm>=0.19.1,<0.20.0",

    # PDF generation
    "reportlab>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-blog-plugin<=0.25",
    "mkdocs-rss-plugin>=1.12.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-bibtex>=2.11.0",
]

[project.scripts]
fable-flow = "fable_flow.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["producer/fable_flow"]

[tool.uv]
package = true
default-groups = ["dev"]

# Pin torch wheels to cu126 — the latest CUDA index that works on driver 535+.
# PyPI's default torch wheel is cu130 which requires driver 580+.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "F401"]
extend-safe-fixes = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# typer requires call expressions in defaults; this is its documented pattern.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
known-first-party = ["fable_flow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "site/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=fable_flow --cov-report=term-missing --cov-report=html"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
