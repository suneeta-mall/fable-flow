model:
  server:
    url: "${env.MODEL_SERVER_URL}"
    api_key: "${env.MODEL_API_KEY}"
    timeout: 600
    max_retries: 3
    retry_delay: 2.0
  default: "${env.DEFAULT_MODEL}"
  max_tokens: 64000
  stream: false
  temperature: 0.8
  continuation:
    enabled: true
    max_continuations: 5
    chunk_size: 32000
  image_generation:
    # Options (ordered by recommended quality / resource cost):
    # - "black-forest-labs/FLUX.2-dev"            (default; SOTA stylised + native
    #                                              image-to-image conditioning, ~24GB)
    # - "black-forest-labs/FLUX.2-klein-9B"       (smaller FLUX 2, ~18GB)
    # - "black-forest-labs/FLUX.2-klein-4B"       (smallest FLUX 2, ~10GB)
    # - "black-forest-labs/FLUX.1-dev"            (legacy; uses XLabs IP-Adapter)
    # - "stabilityai/stable-diffusion-3.5-large"  (alt; ~18GB)
    # - "stabilityai/stable-diffusion-xl-base-1.0" (older, ~8GB; uses h94 IP-Adapter)
    #
    # Character consistency on FLUX 2 uses the model's native image-conditioning
    # input. On FLUX 1 / SDXL it uses IP-Adapter weights loaded lazily. See
    # producer/fable_flow/models/image.py for the dispatch logic.
    model: "black-forest-labs/FLUX.2-dev"
  text_to_speech:
    voice_preset: "af_heart"
    sample_rate: 24000
    lang_code: "a"
  music_generation:
    model: "facebook/musicgen-small"
  video_generation:
    # Options:
    # - "Wan-AI/Wan2.1-I2V-14B-720P-Diffusers"  (default; SOTA-tier I2V, ~25GB)
    # - "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"  (smaller, faster)
    # - "hunyuanvideo-community/HunyuanVideo-I2V"  (alternative; ~30GB)
    model: "Wan-AI/Wan2.1-I2V-14B-720P-Diffusers"
    height: 720
    width: 1280
    num_frames: 81
    num_inference_steps: 40
    guidance_scale: 5.0
    true_cfg_scale: 6.0
    fps: 16

paths:
  output: "output"

style:
  illustration_style: "digital watercolor and ink, soft lighting, warm colors, cinematic"
  music_style: "gentle children's storybook music, soft electronic and orchestral blend"
  video_animation_style: "subtle natural motion, gentle camera drift, soft lighting"

book:
  author: "Suneeta Mall"
  publisher: "FableFlow Publishing"
  publisher_location: "Sydney, Australia"
  edition: "First Edition"
  isbn_pdf: "978-0-XXXXX-XXX-X"
  isbn_epub: "978-0-XXXXX-XXX-X"